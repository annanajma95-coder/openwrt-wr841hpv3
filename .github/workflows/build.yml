name: Build OpenWrt 19.07.9 WR841HP v3

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      # OpenWrt builds run as root inside the Ubuntu container.
      # GNU tar's configure otherwise aborts when building host tools.
      FORCE_UNSAFE_CONFIGURE: "1"
      OPENWRT_VERSION: v19.07.9
      DEVICE_COMMIT: c5235f6b2441a6b531622b76b66c354896c0dae0

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python2 \
            python3 python3-distutils rsync unzip zlib1g-dev \
            file wget curl ca-certificates time perl \
            patch subversion xz-utils zstd cpio

      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Clone OpenWrt 19.07.9
        shell: bash
        run: |
          git clone --depth 1 \
            --branch "$OPENWRT_VERSION" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Backport WR841HP v3 device support
        shell: bash
        working-directory: openwrt
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth=2 \
            https://git.openwrt.org/openwrt/openwrt.git "$DEVICE_COMMIT"

          mkdir -p target/linux/ath79/dts
          git show "$DEVICE_COMMIT:target/linux/ath79/dts/qca9533_tplink_tl-wr841hp-v3.dts" \
            > target/linux/ath79/dts/qca9533_tplink_tl-wr841hp-v3.dts
          # OpenWrt 19.07's dtc requires the DTS version declaration.
          sed -i '2i /dts-v1/;' target/linux/ath79/dts/qca9533_tplink_tl-wr841hp-v3.dts

          if ! grep -q 'Device/tplink_tl-wr841hp-v3' target/linux/ath79/image/generic-tp-link.mk; then
            cat >> target/linux/ath79/image/generic-tp-link.mk <<'EOF'

          define Device/tplink_tl-wr841hp-v3
            $(Device/tplink-8mlzma)
            ATH_SOC := qca9533
            DEVICE_TITLE := TP-Link TL-WR841HP v3
            TPLINK_HWID := 0x08411003
          endef
          TARGET_DEVICES += tplink_tl-wr841hp-v3
          EOF
          fi

          python3 - <<'PY'
          from pathlib import Path

          leds = Path("target/linux/ath79/base-files/etc/board.d/01_leds")
          text = leds.read_text()
          old = "tplink,archer-c60-v3)"
          new = "tplink,archer-c60-v3|\\\ntplink,tl-wr841hp-v3)"
          if "tplink,tl-wr841hp-v3" not in text:
              if old not in text:
                  raise SystemExit("Could not find LED insertion point in 01_leds")
              leds.write_text(text.replace(old, new, 1))

          network = Path("target/linux/ath79/base-files/etc/board.d/02_network")
          text = network.read_text()
          old = "tplink,tl-wr841-v9|\\"
          new = "tplink,tl-wr841hp-v3|\\\n" + old
          if "tplink,tl-wr841hp-v3" not in text:
              if old not in text:
                  raise SystemExit("Could not find network insertion point in 02_network")
              network.write_text(text.replace(old, new, 1))
          PY

          test -s target/linux/ath79/dts/qca9533_tplink_tl-wr841hp-v3.dts
          grep -q 'Device/tplink_tl-wr841hp-v3' target/linux/ath79/image/generic-tp-link.mk
          grep -q 'tplink,tl-wr841hp-v3' target/linux/ath79/base-files/etc/board.d/01_leds
          grep -q 'tplink,tl-wr841hp-v3' target/linux/ath79/base-files/etc/board.d/02_network

      - name: Configure feeds
        shell: bash
        working-directory: openwrt
        run: |
          set -euxo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          cp ../scripts/customize.sh ./customize.sh
          chmod +x customize.sh
          # Initialize the base config once; customize.sh applies selections and resolves dependencies.
          make defconfig
          ./customize.sh

      - name: Install 99-custom-config first-boot settings
        shell: bash
        run: |
          set -euxo pipefail
          cd openwrt
          mkdir -p files/etc/uci-defaults files/etc/config files/etc/opennds files/usr/lib/opennds

          install -m 0644 ../scripts/hotspot-firstboot.sh files/etc/uci-defaults/99-custom-config
          install -m 0755 ../scripts/voucher.sh files/usr/lib/opennds/voucher.sh

          # Validate first-boot configuration before spending time on the full build.
          sh -n ../scripts/hotspot-firstboot.sh
          grep -Fq 'lan_ip_address="192.168.100.1"' ../scripts/hotspot-firstboot.sh
          grep -Fq "set network.voucher='interface'" ../scripts/hotspot-firstboot.sh
          grep -Fq 'root_password="enter"' ../scripts/hotspot-firstboot.sh
          grep -Fq 'wlan_name="SEGALA TEKNIK"' ../scripts/hotspot-firstboot.sh
          grep -Fq "option enabled '1'" ../scripts/opennds
          ! grep -Fq '/etc/init.d/opennds disable' ../scripts/hotspot-firstboot.sh
          ! grep -Fq '/etc/init.d/opennds stop' ../scripts/hotspot-firstboot.sh
          grep -Fq "set wireless.hotspot.ssid='HOTSPOT'" ../scripts/hotspot-firstboot.sh
          grep -Fq "list authenticated_users 'allow all'" ../scripts/opennds
          grep -Fq "set dhcp.lan.ra='disabled'" ../scripts/hotspot-firstboot.sh
          grep -Fq "set dhcp.lan.dhcpv6='disabled'" ../scripts/hotspot-firstboot.sh
          grep -Fq "uci -q delete network.lan.ip6assign" ../scripts/hotspot-firstboot.sh
          grep -Fq "CONFIG_PACKAGE_ppp is not set" .config
          grep -Fq "CONFIG_PACKAGE_kmod-ipv6 is not set" .config

          # Fail closed rather than producing a firmware with a nonfunctional portal.
          test -s ../scripts/opennds
          test -s ../scripts/vouchers
          install -m 0644 ../scripts/opennds files/etc/config/opennds
          install -m 0600 ../scripts/vouchers files/etc/opennds/vouchers

          # Ensure OpenNDS remains included in the image.
          grep -q '^CONFIG_PACKAGE_opennds=y$' .config
          # All package selections are centralized in scripts/customize.sh.

      - name: Build firmware
        shell: bash
        working-directory: openwrt
        run: |
          set -euxo pipefail
          make -j"$(nproc)" download
          make -j2 V=s

      - name: Verify output
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          find openwrt/bin/targets -type f \
            \( -name '*wr841hp*v3*' -o -name '*wr841hp-v3*' \) \
            -exec cp -v {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.bin' -print -quit)"
          sha256sum artifacts/* > artifacts/SHA256SUMS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07.9-wr841hp-v3
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
